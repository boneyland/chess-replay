# The Render static site (chess-replay). The service is linked to a Blueprint, so Render syncs these settings
# from this file on each push to main; edit them here rather than in the dashboard.
services:
  - type: web
    name: chess-replay
    runtime: static
    # the tests run first, so a failing push doesn't go live
    buildCommand: node --test --test-concurrency=1 tests/*.test.cjs && node build.cjs
    staticPublishPath: out/site
    envVars:
      - key: NODE_VERSION
        value: "22"
    # only changes to what goes into the page trigger a deploy
    buildFilter:
      paths:
        - app/**
        - src/**
        - vendor/**
        - openings/**
        - babel/**
        - openings-data.cjs
        - build.cjs
        - render.yaml
    # each pull request gets a temporary deployment, linked on the PR; a Blueprint without this turns them off
    previews:
      generation: automatic
    # the bare domain serves the app; its file name stays the same as on the old notes site
    routes:
      - type: rewrite
        source: /
        destination: /chess-game-video.html
    # revalidate on every visit, so a deploy is live at once; files are taken only as the type they're served as, and
    # other sites see only the origin a visitor came from. The page's Content-Security-Policy is a <meta> in it
    # (build.cjs: it lists the inline scripts' hashes). tests/live/serve.cjs reads these headers from here
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # no other site may show the page in a frame (clickjacking): CSP's frame-ancestors, and X-Frame-Options for old browsers
      - path: /*
        name: Content-Security-Policy
        value: frame-ancestors 'self'
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      # cross-origin isolation, so the page gets SharedArrayBuffer and Stockfish can search with several threads; every
      # cross-origin file the page loads must then be CORS or send Cross-Origin-Resource-Policy. Rollback: delete these two
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Embedder-Policy
        value: require-corp
