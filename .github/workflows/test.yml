# Build the page and run the JS tests on every push to main and every pull request, and the browser smoke tests against the build:
# desktop and phone layouts in Chrome, Firefox and WebKit (iPhone Safari's engine), real Chrome on an Android emulator,
# Safari on an iOS Simulator, and desktop Safari on macOS.
# The Python cross-check (tests/check_browser_json.py) is left out: it imports chess-animator, which needs Manim.
name: test
# pushes to main and pull requests: a push to a PR's branch runs once, as the PR (both triggers ran it twice); a tag
# push starts nothing
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'media/**', '*.md', 'LICENSE']
  pull_request:
    paths-ignore: ['docs/**', 'media/**', '*.md', 'LICENSE']
# the job only reads the repo
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: node build.cjs
      - run: node --test --test-concurrency=1 tests/*.test.cjs
  # The smoke tests (tests/live/site.test.cjs) against this commit's build, served the way render.yaml has Render
  # serve it: in the runner's own Google Chrome and Firefox (Firefox over WebDriver BiDi; no browser download), and in
  # Playwright's WebKit, the engine of iPhone Safari (its phone tests get the iPhone 13 profile). One job per browser and
  # part, side by side: the engine part is the tests that wait out engines starting (Stockfish's threads failing and
  # falling back, the full engine's 99 MB download), the rest is everything else. Failures are also reported as
  # annotations (@reporters/github), which a token that can't read the job's log can still read. WebKit's main part
  # takes about 15 minutes and its heavy part about 15 (2026-11-09), so the limit leaves room for a page that keeps a test waiting out its 30 s load timeout
  browsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        part: [main, engine, heavy]
    env:
      LIVE_URLS: local
      LIVE_BROWSERS: ${{ matrix.browser }}
      ENGINE_TESTS: '^desktop: (a threaded engine that never|Full whose threaded engine|the full engine downloads)'
      # the slowest subtests (each opens its own page), a part of their own: in WebKit the rest ran about 29 minutes, and a
      # slow runner went past the 30-minute limit (2026-11-03). WebKit's main part grew back to 23–30 minutes (2 of 5 runs
      # cancelled at the limit, 2026-11-09), so its 14 slowest non-engine tests, about 10 minutes there, moved here too
      # (the second line). Play vs (Stockfish|computer): the tests' names before and after the rename
      HEAVY_TESTS: '^(desktop: Position from image: download|desktop: a variable frame rate MP4|layout: nothing cut off|desktop: Play vs human turns the board|desktop: My games keeps|phone: an export is|desktop: an export is|desktop: the export.s own drawing|desktop: a WebM export|desktop: the explorer names the opening|desktop: Play vs (Stockfish|computer) (flags|replies)|desktop: dead positions end a game|desktop: the free board sets up|desktop: a picture board with its hue|desktop: the cloud evaluation shows|desktop: Prefer cloud takes|desktop: a running game analysis pauses|desktop: Import game opens a PGN|desktop: without WebAssembly SIMD, Go deeper|desktop: the start shows Stockfish|desktop: the Lichess explorer asks)'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1.63.0 @reporters/github@2.1.4
      - if: matrix.browser == 'chromium'
        run: google-chrome --version && echo "CHROMIUM_CHANNEL=chrome" >> "$GITHUB_ENV"
      - if: matrix.browser == 'firefox'
        run: firefox --version && echo "FIREFOX_PATH=$(readlink -f "$(command -v firefox)")" >> "$GITHUB_ENV"
      # WebKit's system packages (~180 debs, 114 MB) come from the runner's Ubuntu mirror, which once crawled at ~20 KB/s
      # and ran a job out of its 30 minutes (2026-11-05), so the .debs are cached. apt checks each cached .deb against
      # the package index it has just fetched, so a stale or changed one is downloaded again, never used. The key moves
      # with the runner image (weekly) and Playwright; a new key starts from the newest older cache
      - if: matrix.browser == 'webkit'
        id: apt-key
        run: echo "key=apt-webkit-pw1.63.0-$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - if: matrix.browser == 'webkit'
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs
          key: ${{ steps.apt-key.outputs.key }}
          restore-keys: apt-webkit-pw1.63.0-
      - if: matrix.browser == 'webkit'
        name: Install WebKit and its system packages (from the cached .debs where they still match)
        run: |
          echo 'APT::Keep-Downloaded-Packages "true"; Binary::apt::APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99keep-debs
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
          if ls ~/apt-debs/*.deb >/dev/null 2>&1; then sudo cp ~/apt-debs/*.deb /var/cache/apt/archives/; fi
          npx playwright install --with-deps webkit
          # autoclean drops the .debs the index no longer offers (superseded versions), so the cache doesn't grow with them
          sudo apt-get autoclean -qq
          rm -rf ~/apt-debs && mkdir ~/apt-debs && cp /var/cache/apt/archives/*.deb ~/apt-debs/ 2>/dev/null || true
          echo "$(ls ~/apt-debs | wc -l) .debs, $(du -sh ~/apt-debs | cut -f1)"
      - if: matrix.browser == 'webkit' && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs
          key: ${{ steps.apt-key.outputs.key }}
      - if: matrix.part == 'engine'
        run: echo "LIVE_ONLY=$ENGINE_TESTS" >> "$GITHUB_ENV"
      - if: matrix.part == 'heavy'
        run: echo "LIVE_ONLY=$HEAVY_TESTS" >> "$GITHUB_ENV"
      - if: matrix.part == 'main'
        run: echo "LIVE_SKIP=$ENGINE_TESTS|$HEAVY_TESTS" >> "$GITHUB_ENV"
      - run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=@reporters/github --test-reporter-destination=stdout tests/live/site.test.cjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: screenshots-${{ matrix.browser }}-${{ matrix.part }}
          path: tests/out/live/
  # tests/live/android.test.cjs: Chrome on an Android emulator (KVM on the runner). The google_apis image has Chrome
  # and is debuggable, so Playwright can give Chrome its command line without chrome://flags
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1.63.0 @reporters/github@2.1.4
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=@reporters/github --test-reporter-destination=stdout tests/live/android.test.cjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: android-screenshots
          path: tests/out/live/
  # tests/live/ios.test.cjs: Apple's own Safari on an iOS Simulator, over WebDriver (safaridriver), for what
  # Playwright's WebKit for Linux can't show: iOS's bars and safe areas, no element full screen, Apple's codecs
  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock webdriverio@9.12.0 @reporters/github@2.1.4
      - run: sudo safaridriver --enable && xcodebuild -version && xcrun simctl list runtimes
      - run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=@reporters/github --test-reporter-destination=stdout tests/live/ios.test.cjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ios-screenshots
          path: tests/out/live/
  # tests/live/safari.test.cjs: Apple's own desktop Safari on macOS, over WebDriver (safaridriver), at the desktop layout
  # with mouse input; whichever Safari the runner's image has. A required check (since 2026-11-08)
  safari:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock webdriverio@9.12.0 @reporters/github@2.1.4
      - run: sudo safaridriver --enable && safaridriver --version
      - run: system_profiler SPDisplaysDataType | grep -i resolution || true
      - run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=@reporters/github --test-reporter-destination=stdout tests/live/safari.test.cjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: safari-screenshots
          path: tests/out/live/
